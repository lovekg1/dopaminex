<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xem video</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        video {
            width: 100%;
            max-height: 80vh;
            background: black;
        }

        h1 {
            font-size: 22px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Video của bạn</h1>

    <video controls playsinline>
        <source
            src="https://video.twimg.com/amplify_video/2096576003342766080/pl/avc1/1280x720/HC1-iZ9JeR4OQ2R5.m3u8"
            type="video/mp4">
    </video>

</div>

</body>
</html>
